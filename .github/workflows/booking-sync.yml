name: Booking.com Calendar Sync

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup Firebase Service Account
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > serviceAccountKey.json

      - name: Import from Booking.com (Sync to Firestore)
        env:
          BOOKING_ICAL_URL: ${{ secrets.BOOKING_ICAL_URL }}
        run: node scripts/sync-booking.js

      - name: Generate iCal Export (Firestore → public/calendar.ics)
        run: node scripts/generate-ical.js

      - name: Build app (copies public/* into dist/)
        run: npm run build

      - name: Deploy to Firebase Hosting (app + iCal)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: roqi-apartments
          channelId: live

      - name: Show iCal URL
        run: |
          echo "📅 iCal Export URL: https://roqi-apartments.web.app/calendar.ics"
          echo "🔗 Use this URL in Booking.com Extranet → Calendar Sync → Import"